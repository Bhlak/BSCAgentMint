services:
  bscagentmint:
    build: .
    container_name: bscagentmint
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Asia/Shanghai
      # Fixed device fingerprint: baw sessions are encrypted with it and remain valid after container rebuilds.
      BINANCE_INSTANCE_ID: bscagentmint-nas
    volumes:
      - ./.env:/app/.env:ro
      - ./data:/app/data
      - ./logs:/app/logs
      - baw-session:/root/.baw

volumes:
  baw-session:
